<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Ban / Unban - Ultimate Hacker</title>
<style>
  body {
    background: #000;
    color: #00ff00;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
  }
  .container {
    background: rgba(10,10,10,0.9);
    border: 2px solid #00ff00;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 0 30px #00ff00;
    border-radius: 10px;
    backdrop-filter: blur(4px);
    z-index: 1;
  }
  h1.glitch {
    color: #00ff00;
    text-shadow: 0 0 10px #00ff00;
    position: relative;
    animation: glitch 2s infinite;
  }
  @keyframes glitch {
    0% { text-shadow: 2px 0 red, -2px 0 cyan; }
    25% { text-shadow: -2px 0 red, 2px 0 cyan; }
    50% { text-shadow: 2px 0 red, -2px 0 cyan; }
    100% { text-shadow: 0 0 10px #00ff00; }
  }
  input {
    width: 80%;
    padding: 10px;
    background: #111;
    border: 1px solid #00ff00;
    color: #00ff00;
    margin: 15px 0;
    font-size: 16px;
    outline: none;
  }
  button {
    padding: 10px 20px;
    margin: 10px;
    background: #00ff00;
    color: #000;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
  }
  button:hover {
    background: #00cc00;
    box-shadow: 0 0 20px #00ff00;
  }
  #log {
    height: 180px;
    background: rgba(0,0,0,0.8);
    border: 1px dashed #00ff00;
    margin-top: 20px;
    padding: 10px;
    text-align: left;
    overflow-y: auto;
    font-size: 13px;
  }
  .progress {
    width: 100%;
    height: 8px;
    background: #111;
    border: 1px solid #00ff00;
    margin: 10px 0;
    display: none;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: #00ff00;
    box-shadow: 0 0 10px #00ff00;
    transition: width 0.3s;
  }
  .red { color: red; text-shadow: 0 0 5px red; }
  .green { color: #00ff00; }
  .cyan { color: cyan; }
  .typing::after {
    content: '|';
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="container">
  <h1 class="glitch">WHATSAPP BAN / UNBAN</h1>
  <p>Enter Target Number</p>
  <input type="text" id="number" placeholder="+92 3xx xxxxxxx">
  <br>
  <button onclick="startBan()">BAN ACCOUNT</button>
  <button onclick="startUnban()">UNBAN ACCOUNT</button>
  
  <div class="progress"><div class="progress-bar" id="prog"></div></div>
  <div id="log"></div>
</div>

<script>
// 1. Matrix Background
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*(){}[]<>?/";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0F0";
  ctx.font = fontSize + "px monospace";
  for(let i = 0; i < drops.length; i++) {
    ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 33);

// 2. Beep Sound Effect
function beep() {
  const audio = new AudioContext();
  const osc = audio.createOscillator();
  osc.frequency.value = 800;
  osc.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + 0.1);
}

// Prank Logic
let log = document.getElementById('log');
let prog = document.getElementById('prog');
let progressBox = document.querySelector('.progress');

function addLog(text, cls='') {
  log.innerHTML += `<div class="${cls} typing">${text}</div>`;
  log.scrollTop = log.scrollHeight;
  beep();
}

function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

async function updateProgress(val) {
  progressBox.style.display = 'block';
  prog.style.width = val + '%';
  await delay(200);
}

async function randomData() {
  // 3. Random Data Stream Effect
  for(let i=0; i<3; i++) {
    let rand = Math.random().toString(36).substring(2,15).toUpperCase();
    addLog(`[DATA] ${rand}-${rand}`, 'cyan');
    await delay(300);
  }
}

async function startBan() {
  let num = document.getElementById('number').value;
  if(num === '') { alert('Number dalo pehle'); return; }
  log.innerHTML = '';
  progressBox.style.display = 'block';
  prog.style.width = '0%';
  
  addLog(`[INIT] Connecting to WhatsApp Servers...`);
  await delay(800); await updateProgress(20);
  
  // 4. IP Scanner Effect
  addLog(`[SCAN] Scanning IPs: 192.168.1.1 ... 192.168.1.254`);
  await randomData();
  await delay(800); await updateProgress(40);
  
  addLog(`[OK] Connected to IP: 192.168.45.21`);
  addLog(`[SCAN] Target Found: ${num}`);
  await delay(800); await updateProgress(60);
  
  addLog(`[ACCESS] Bypassing 2FA Security...`);
  await randomData();
  await delay(800); await updateProgress(80);
  
  addLog(`[WARNING] Account flagged for violation`, 'red');
  await delay(600); await updateProgress(90);
  
  addLog(`[ACTION] BANNING ACCOUNT PERMANENTLY...`, 'red');
  await delay(800); await updateProgress(100);
  
  addLog(`[SUCCESS] ${num} has been BANNED`, 'red');
  await delay(500);
  addLog(`[NOTE] This is just a prank :)`, 'green');
  setTimeout(()=>progressBox.style.display='none', 2000);
}

async function startUnban() {
  let num = document.getElementById('number').value;
  if(num === '') { alert('Number dalo pehle'); return; }
  log.innerHTML = '';
  progressBox.style.display = 'block';
  prog.style.width = '0%';
  
  addLog(`[INIT] Connecting to WhatsApp Support API...`);
  await delay(800); await updateProgress(25);
  
  addLog(`[SCAN] Finding Ban Record for: ${num}`);
  await randomData();
  await delay(800); await updateProgress(50);
  
  addLog(`[ACCESS] Submitting Unban Request...`);
  await delay(800); await updateProgress(75);
  
  addLog(`[REVIEW] Appeal Under Review...`);
  await delay(1000); await updateProgress(100);
  
  addLog(`[SUCCESS] ${num} has been UNBANNED`, 'green');
  await delay(500);
  addLog(`[NOTE] This is just a prank :)`, 'green');
  setTimeout(()=>progressBox.style.display='none', 2000);
}

window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
</script>
</body>
</html>
